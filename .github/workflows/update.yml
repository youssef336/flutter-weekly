name: Update videos

on:
  schedule:
    - cron: '0 6 * * *' # every day 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch.py
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/videos.json
          # Only commit when videos changed, not just the updatedAt timestamp.
          if git diff --cached --numstat | awk '{s+=$1} END {exit !(s>1)}'; then
            git commit -m 'chore: update videos'
            git push
          else
            echo 'No new videos'
          fi
