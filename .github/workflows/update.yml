name: Update videos

on:
  schedule:
    - cron: '0 8 * * *' # every day 08:00 UTC, just after Gemini's daily free quota resets (midnight Pacific)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch.py
      - name: AI summaries (Gemini)
        run: python scripts/summarize.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      - name: Commit if changed
        if: always() # keep the summaries that did succeed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/videos.json
          # Only commit when videos changed, not just the updatedAt timestamp.
          if git diff --cached --numstat | awk '{s+=$1} END {exit !(s>1)}'; then
            git commit -m 'chore: update videos'
            git push
          else
            echo 'No new videos'
          fi
